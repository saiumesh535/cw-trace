[package]
name = "cw-trace-app"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "cw_trace_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cw-trace-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
chrono = "0.4"
cdk-graph = { path = "../../crates/cdk-graph" }
synth = { path = "../../crates/synth" }
aws-obs = { path = "../../crates/aws-obs" }
correlate = { path = "../../crates/correlate" }
