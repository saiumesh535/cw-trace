[package]
name = "aws-obs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aws-config = "1"
aws-sdk-cloudwatchlogs = "1"
aws-sdk-xray = "1"
aws-smithy-types = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "macros", "time"] }
chrono = { version = "0.4", features = ["serde"] }
